<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英语口语面试题库 · English Interview Prep</title>
<style>
  :root {
    --bg: #f7f8fa;
    --sidebar-bg: #ffffff;
    --content-bg: #ffffff;
    --text: #1f2329;
    --text-secondary: #4e5562;
    --text-muted: #8a919e;
    --border: #e8eaee;
    --accent: #3b6fe0;
    --accent-soft: #eef3fd;
    --accent-light: #f5f8ff;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(31, 35, 41, 0.06), 0 4px 16px rgba(31, 35, 41, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .layout {
    display: flex;
    min-height: 100vh;
  }

  /* ============ Sidebar ============ */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-badge {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, #3b6fe0, #6a9bf5);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .sidebar-header p {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .nav {
    padding: 14px 12px 24px;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    color: var(--text-secondary);
    margin-bottom: 2px;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }

  .nav-item:hover { background: #f2f4f8; }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  .nav-num {
    font-size: 12px;
    font-weight: 600;
    min-width: 24px;
    height: 24px;
    border-radius: 7px;
    background: #f0f2f5;
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-item.active .nav-num {
    background: var(--accent);
    color: #fff;
  }

  .nav-title {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.45;
    padding-top: 1px;
  }

  .nav-item.active .nav-title { font-weight: 600; }

  .sidebar-footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: #eef0f3;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #3b6fe0, #6a9bf5);
    width: 0%;
    transition: width 0.15s ease;
  }

  /* ============ Content ============ */
  .content {
    flex: 1;
    min-width: 0;
    padding: 40px 48px 80px;
    max-width: 960px;
  }

  .section {
    margin-bottom: 56px;
    scroll-margin-top: 32px;
  }

  .q-tag {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }

  .q-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 24px;
  }

  .card {
    background: var(--content-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    margin-bottom: 22px;
  }

  .card-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .card-label .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .card.details .card-label .dot { background: #22b07d; }

  .card ul { padding-left: 20px; }
  .card li { margin-bottom: 10px; color: var(--text-secondary); font-size: 15px; }
  .card li:last-child { margin-bottom: 0; }
  .card li strong { color: var(--text); }

  .card.details p {
    margin-bottom: 14px;
    color: var(--text-secondary);
    font-size: 15.5px;
  }
  .card.details p:last-child { margin-bottom: 0; }

  .subhead {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin: 6px 0 10px;
  }

  .arrow { color: var(--accent); font-weight: 600; }

  .divider {
    border: none;
    border-top: 1px dashed var(--border);
    margin-top: 48px;
  }

  /* back to top */
  .back-top {
    position: fixed;
    right: 28px;
    bottom: 28px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
    font-size: 18px;
    color: var(--text-secondary);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 40;
  }

  .back-top.show { opacity: 1; pointer-events: auto; }
  .back-top:hover { color: var(--accent); border-color: var(--accent); }

  /* mobile */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 60;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
    box-shadow: var(--shadow);
    cursor: pointer;
    font-size: 18px;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31, 35, 41, 0.3);
    z-index: 49;
  }

  @media (max-width: 860px) {
    .sidebar {
      position: fixed;
      left: -320px;
      z-index: 50;
      transition: left 0.25s ease;
      box-shadow: 4px 0 20px rgba(0,0,0,0.08);
    }
    .sidebar.open { left: 0; }
    .overlay.show { display: block; }
    .menu-toggle { display: block; }
    .content { padding: 72px 20px 60px; }
  }
</style>
</head>

const nav = document.getElementById("nav");
const content = document.getElementById("content");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuToggle = document.getElementById("menuToggle");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const backTop = document.getElementById("backTop");

function buildNav() {
  QUESTIONS.forEach((q, i) => {
    const btn = document.createElement("button");
    btn.className = "nav-item";
    btn.innerHTML = `<span class="nav-num">${i + 1}</span><span class="nav-title">${q.title}</span>`;
    btn.addEventListener("click", () => {
      document.getElementById("q-" + i).scrollIntoView({ behavior: "smooth" });
      closeSidebar();
    });
    nav.appendChild(btn);
  });
}

function buildContent() {
  content.innerHTML = QUESTIONS.map((q, i) => {
    const points = q.points.map(p => `<li>${p}</li>`).join("");
    const details = q.details.map(d => `<p>${d}</p>`).join("");
    const divider = i < QUESTIONS.length - 1 ? '<hr class="divider" />' : "";
    return `
    <section class="section" id="q-${i}">
      <div class="q-tag">Question ${i + 1} / ${QUESTIONS.length} · ${q.cn}</div>
      <h2 class="q-title">${q.title}</h2>
      <div class="card">
        <div class="card-label"><span class="dot"></span>Key Points · 答题要点</div>
        <ul>${points}</ul>
      </div>
      <div class="card details">
        <div class="card-label"><span class="dot"></span>Sample Answer · 完整回答</div>
        ${details}
      </div>
      ${divider}
    </section>`;
  }).join("");
}

// 滚动监听：高亮当前题目 + 更新进度
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const sections = document.querySelectorAll(".section");
    let activeIdx = 0;
    sections.forEach((sec, i) => {
      if (sec.getBoundingClientRect().top <= 120) activeIdx = i;
    });
    document.querySelectorAll(".nav-item").forEach((el, idx) => {
      el.classList.toggle("active", idx === activeIdx);
    });
    progressFill.style.width = ((activeIdx + 1) / QUESTIONS.length * 100) + "%";
    progressText.textContent = (activeIdx + 1) + " / " + QUESTIONS.length;
    backTop.classList.toggle("show", window.scrollY > 400);
    ticking = false;
  });
}

function closeSidebar() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

menuToggle.addEventListener("click", () => {
  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
});
overlay.addEventListener("click", closeSidebar);
backTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", onScroll, { passive: true });

buildNav();
buildContent();
onScroll();
</script>
</body>
</html>
