server {
    listen 3000;
    server_name localhost;

    # 默认 1m，上传图片等会 413；需与 NPM / 后端限制协调一致
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml application/x-javascript application/x-font-ttf font/opentype;

    # index.html - 不缓存（入口文件，确保更新立即生效）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # 静态资源 - 长期缓存（Vite 构建的文件带 hash，可以安全缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理 - 不缓存（动态数据）
    # ^~ 避免下方 ~* \.(png|...) 正则抢走 /api/.../xxx.png（否则会去 root 找静态文件导致 404）
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 明确不缓存 API 响应
        proxy_no_cache 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # React app routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
