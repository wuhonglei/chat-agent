      if (typeof Aegis === "function") {
        globalThis.aegis = new Aegis({
          id: "Lle1dCjZ85lmyW0R9m", // 上报 id
          uin: localStorage.getItem("user_id") || "",

          reportAssetSpeed: true, // 静态资源测速
          spa: true, // spa 应用页面跳转的时候开启 pv 计算
          hostUrl: "https://rumt-zh.com",
          env: location.hostname.includes("chat.wuhonglei.cn")
            ? "production"
            : "development",

      }
    </script>
