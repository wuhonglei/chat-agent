services:
  postgres:
    # 国内/腾讯云：使用 DaoCloud 镜像加速，避免直连 Docker Hub 超时
    # 若在腾讯云内网且已配置 mirror.ccs.tencentyun.com，可改为 pgvector/pgvector:pg18-alpine
    image: docker.m.daocloud.io/pgvector/pgvector:pg18-alpine
    container_name: ai-doc-postgres
    # 暴露端口到宿主机，可通过宿主机 IP:5432 访问
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER_NAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - ai-doc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER_NAME} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-doc-backend
    environment:
      DATABASE__HOST: postgres
      COMPONENT_SCHEMA_API_URL: http://frontend:3000/component-schemas/
    env_file:
      - .env
    # 暴露端口到宿主机，可通过宿主机 IP:8000 访问
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - ai-doc-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-doc-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-doc-network
    restart: unless-stopped

networks:
  ai-doc-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
