services:
  postgres:
    # 使用 pgvector 官方预构建镜像
    image: pgvector/pgvector:pg18
    container_name: chat-agent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER_NAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    # 压测建议：8 workers × 12 连接 = 96，默认 100 余量不足；调至 200
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - chat-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${PG_USER_NAME} -d $${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-agent-backend
    environment:
      DATABASE__HOST: postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - chat-agent-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 使用 127.0.0.1：避免容器内 localhost 优先解析到 ::1，而服务仅监听 IPv4(0.0.0.0) 时 curl 连接失败
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 10s
      retries: 8
      # start.sh 最多等库 60s + 迁移 + 多 worker 冷启动（lifespan/MCP），需大于 compose 默认等待窗口
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-agent-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chat-agent-network
    restart: unless-stopped

  evaluator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-agent-evaluator
    command: ["uv", "run", "python", "-m", "eval_worker.main"]
    environment:
      DATABASE__HOST: postgres
      APP__DEBUG: "0"
      EVAL_WORKER__ENABLED: "true"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - chat-agent-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  chat-agent-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
