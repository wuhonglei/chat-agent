services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-doc-postgres
    environment:
      POSTGRES_DB: ai_assistant_db
      POSTGRES_USER: ${PG_USER_NAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - ai-doc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER_NAME:-postgres} -d ai_assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-doc-backend
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ai_assistant_db
      PG_USER_NAME: ${PG_USER_NAME:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - ai-doc-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-doc-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-doc-network
    restart: unless-stopped

networks:
  ai-doc-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
