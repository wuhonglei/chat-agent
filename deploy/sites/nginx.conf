# sites 静态站网关：Host -> slug -> backend/data/sites/{slug}/current
# 只读挂载；无 gateway、无 Redis；对不上的 Host 一律 404

# 非法 Host / 无 Host 的探活 / 超长或含非法字符的 slug：全部落到这里，返回 404
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    # slug 仅允许小写字母/数字/连字符、3-40 位；对不上正则就走上面的 default_server 404
    # 量词必须用引号包住整条正则：nginx 配置解析器会把裸 { 当块起始符，不引号直接语法错误
    # （nginx 会把 Host 转小写后再匹配，所以大写域名等价于小写，符合 DNS 语义）
    server_name "~^(?<slug>[a-z0-9-]{3,40})\.apps\.wuhonglei\.cn$";

    # current 是软链，摘掉即 404（下线不能只改 DB）
    root /app/data/sites/$slug/current;
    index index.html;

    sendfile on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    autoindex off;
    server_tokens off;

    # 隐藏文件/目录（.env、.git 等）：返回 404 而不是 403——403 等于确认文件存在
    location ~ /\. {
        return 404;
    }

    # Vite 产物带内容 hash，可长期缓存；缺失时直接 404，不要回退成 index.html
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SVG 可内嵌脚本，单独收紧；不要给 HTML 套这个头，否则站内样式/字体全废
    location ~* \.svg$ {
        add_header Content-Security-Policy "default-src 'none'";
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证重新发布后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 子路由回退到入口，刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
