# AI Assistant Backend 配置文件示例
# 此文件包含应用程序的所有配置项，采用层级结构便于管理
# 复制此文件为 config.yaml 并填入实际的配置值

# 应用程序基础配置
app:
  name: "AI Assistant"
  version: "0.1.0"
  debug: false
  host: "0.0.0.0"
  port: 8000

# LLM 模型 API 配置
llm:
  api_key: "your_llm_api_key_here"  # 必填：LLM API 密钥
  api_base: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  think_model: "deepseek-reasoner"

# MCP 配置
mcp:
  context7:
    api_key: "your_context7_api_key_here"  # Context7 API 密钥
  confluence_mcp:
    CONFLUENCE_URL: "https://your-confluence-instance.com"  # Confluence 地址
    CONFLUENCE_PERSONAL_TOKEN: "your_personal_token"  # Confluence 个人访问令牌
    CONFLUENCE_AUTH_TYPE: "pat"  # Confluence 认证类型
  weather_mcp:
    QWEATHER_API_KEY: "your_weather_api_key_here"  # Weather API 密钥
    QWEATHER_BASE_URL: "https://your-weather-api-url.com"  # Weather API 基础 URL
    QWEATHER_TIMEOUT: 10  # Weather API 超时时间
  tavily_mcp:
    TAVILY_API_KEY: "your_tavily_api_key_here"  # Tavily API 密钥

# 存储配置
storage:
  # 本地存储
  avatar_dir: "./data/avatars"
  
  # 腾讯云 COS 存储配置
  tencent_cos:
    secret_id: "your_tencent_cos_secret_id"  # 必填：腾讯云 Secret ID
    secret_key: "your_tencent_cos_secret_key"  # 必填：腾讯云 Secret Key
    region: "ap-guangzhou"  # 存储区域
    bucket: "your-bucket-name"  # 存储桶名称

# 安全配置
security:
  jwt:
    algorithm: "RS256"
    private_key_path: "./private_keys/v1_private_key.pem"
    public_key_path: "./private_keys/v1_public_key.pem"

# Cloudbase 配置
cloudbase:
  env_id: "your_cloudbase_env_id"  # 必填：Cloudbase 环境 ID

# PostgreSQL 数据库配置
database:
  host: "localhost"
  port: 5432
  db: "ai_assistant_db"
  username: "your_database_username"  # 必填：数据库用户名
  password: "your_database_password"  # 必填：数据库密码

