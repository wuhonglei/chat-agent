[project]
name = "chat-agent-backend"
version = "0.1.0"
description = "Enterprise Knowledge Base Q&A System Backend"
requires-python = ">=3.10"
dependencies = [
    # Core Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # DeepSeek Integration
    "openai>=2.31.0", # DeepSeek uses OpenAI-compatible API
    # Search & Retrieval Enhancement
    "tavily-python>=0.7.23", # Web search
    # Storage & Cache
    "aiofiles>=23.2.0",
    # HTTP & Async
    "httpx>=0.25.0",
    # Utils
    "pyyaml>=6.0.0", # YAML configuration file support
    # Database Migration
    "alembic>=1.13.1",
    # Security
    "cryptography>=46.0.7",
    # Monitoring & Logging
    "loguru>=0.7.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.11",
    "sqlmodel>=0.0.27",
    "pyjwt>=2.12.1",
    "cos-python-sdk-v5>=1.9.41", # 腾讯云 COS SDK
    "tencentcloud-sdk-python-sms>=3.1.56", # 腾讯云短信 SDK
    "tzlocal>=5.3.1",
    "humanize>=4.14.0",
    "nacos-sdk-python>=3",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
    "fastmcp>=3.1.0",
    "json-repair>=0.56.0", # 解析/修复 LLM 返回的畸形 JSON
    "toolz>=1.1.0",
    "langchain-community>=0.4.1",
    "faiss-cpu>=1.13.2",
    "dashscope>=1.25.16",
    "pgvector>=0.3.0",
    "aiopyston>=1.2.1",
    "py-key-value-aio[filetree]>=0.4.4",
    "pillow>=12.2.0",
    "markitdown[pdf]>=0.1.3",
    "pymupdf>=1.26.5",
    "mineru-kie-sdk>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "pre-commit>=3.6.0",
    "ipython>=8.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

# mypy 配置已迁移至 mypy.ini

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501", "B008", "B905", "B904", "F821", "F841", "E722"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "types-aiofiles>=24.1.0",
    "types-requests>=2.32.4.20260107",
    "types-PyYAML>=6.0.12",
]
