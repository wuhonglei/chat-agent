[project]
name = "ai-doc-backend"
version = "0.1.0"
description = "Enterprise Knowledge Base Q&A System Backend"
requires-python = ">=3.10"
dependencies = [
    # Core Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # DeepSeek Integration
    "openai>=1.10.0", # DeepSeek uses OpenAI-compatible API
    # Document Processing
    "beautifulsoup4>=4.12.0",
    # External Document Integration
    "atlassian-python-api>=3.41.0", # Confluence
    # Search & Retrieval Enhancement
    "tavily-python>=0.3.0", # Web search
    # Storage & Cache
    "aiofiles>=23.2.0",
    # HTTP & Async
    "httpx>=0.25.0",
    # Utils
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0", # YAML configuration file support
    # Database Migration
    "alembic>=1.13.1",
    # Security
    "cryptography>=41.0.0",
    "restrictedpython>=6.0.0", # 代码执行沙箱
    # Monitoring & Logging
    "loguru>=0.7.0",
    "markdownify>=1.2.0",
    # confluence mcp dependency
    "keyring>=25.6.0",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.43",
    "psycopg2-binary>=2.9.11",
    "sqlmodel>=0.0.27",
    "PyJWT>=2.0.0",
    "cos-python-sdk-v5>=1.9.0", # 腾讯云 COS SDK
    "tzlocal>=5.3.1",
    "nacos-sdk-python>=2.0.9",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
    "fastmcp>=2.13.3",
    "jsonschema>=4.25.0",  # JSON Schema validation
    "toolz>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipython>=8.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008", "B905", "B904", "F821", "F841", "E722"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
