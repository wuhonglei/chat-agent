[project]
name = "ai-doc-backend"
version = "0.1.0"
description = "Enterprise Knowledge Base Q&A System Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # RAG & Vector Database
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "chromadb>=0.4.22",
    # DeepSeek Integration
    "openai>=1.10.0", # DeepSeek uses OpenAI-compatible API
    "tiktoken>=0.5.2",
    # Document Processing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",
    "unstructured>=0.11.0",
    # External Document Integration
    "atlassian-python-api>=3.41.0", # Confluence
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    # Search & Retrieval Enhancement
    "rank-bm25>=0.2.2", # BM25 keyword search
    "sentence-transformers>=2.2.0", # For reranking
    "tavily-python>=0.3.0", # Web search
    # Storage & Cache
    "redis>=5.0.0",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
    # HTTP & Async
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",
    # Utils
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
    # Monitoring & Logging
    "loguru>=0.7.0",
    "prometheus-client>=0.19.0",
    "dashscope>=1.24.4",
    "markdownify>=1.2.0",
    "fastmcp>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501", "B008", "B905", "B904", "F821", "F841", "E722"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
