[mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# 模块级别覆盖：忽略以下模块的类型检查错误
[mypy-tests.*]
ignore_errors = true

[mypy-app.tests.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.confluence_mcp.*]
ignore_errors = true

[mypy-app.core.jwt]
ignore_errors = true

[mypy-app.core.db]
ignore_errors = true

[mypy-app.mcp.cache]
ignore_errors = true

[mypy-app.services.*]
ignore_errors = true

[mypy-app.agents.*]
ignore_errors = true

[mypy-app.models.*]
ignore_errors = true

[mypy-app.utils.network]
ignore_errors = true

[mypy-app.utils.file]
ignore_errors = true

[mypy-app.middleware.*]
ignore_errors = true

[mypy-app.mcp.mcp_client]
ignore_errors = true

[mypy-app.mcp.test_mcp_client]
ignore_errors = true


# MCP 服务与配置（含 Pydantic Settings、ToolResult 等与 mypy  strict 的兼容）
[mypy-app.mcp.mcp_servers.weather_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.tavily_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.ip_locator_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.code_exec_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.context7_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.time_mcp.*]
ignore_errors = true

[mypy-app.core.nacos.*]
