[mypy]
strict = true
ignore_missing_imports = true
# strict 不包含：检测不可达/冗余代码
warn_unreachable = true

# 模块级别覆盖：忽略以下模块的类型检查错误
[mypy-tests.*]
ignore_errors = true

[mypy-app.tests.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.confluence_mcp.*]
ignore_errors = true


# MCP 服务与配置（含 Pydantic Settings、ToolResult 等与 mypy  strict 的兼容）
[mypy-app.mcp.mcp_servers.weather_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.tavily_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.ip_locator_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.code_exec_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.context7_mcp.*]
ignore_errors = true

[mypy-app.mcp.mcp_servers.time_mcp.*]
ignore_errors = true


[mypy-app.core.jwt]
ignore_errors = false

[mypy-app.services.*]
ignore_errors = false

[mypy-app.agents.*]
ignore_errors = false

[mypy-app.models.*]
ignore_errors = false
disable_error_code = call-overload

[mypy-app.mcp.mcp_client]
ignore_errors = true

[mypy-app.mcp.test_mcp_client]
ignore_errors = true

