# 跳过 Cursor 技能等第三方/生成内容（路径相对 git 仓库根目录）
exclude: '\.cursor/skills/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: \.py$
        exclude: ^(tests/|app/mcp/)

  # mypy 类型检查，仅对暂存的 .py 变更文件检查（路径相对于 git 根 chat-agent，需去掉 backend/ 再在 backend 下执行）
  # 排除 tests 目录
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && FILES=(); for f in "$@"; do p="${f#backend/}"; [[ "$p" == tests/* ]] && continue; FILES+=("$p"); done; [[ ${#FILES[@]} -eq 0 ]] || uv run mypy "${FILES[@]}"' sh
        language: system
        types: [python]
        files: \.py$
        pass_filenames: true
