repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: \.py$
        exclude: ^(tests/|app/mcp/)

  # mypy 类型检查，仅对暂存的 .py 变更文件检查（路径相对于 git 根 ai-doc，需去掉 backend/ 再在 backend 下执行）
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && FILES=(); for f in "$@"; do FILES+=("${f#backend/}"); done; uv run mypy "${FILES[@]}"' sh
        language: system
        types: [python]
        files: \.py$
        pass_filenames: true
