# 跳过 Cursor 技能、backend/skills 等第三方/生成内容（路径相对 git 仓库根目录）
exclude: '(^|/)(\.cursor/skills/|backend/skills/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        files: \.py$
        exclude: ^(tests/|app/mcp/|backend/skills/)

  # mypy 类型检查，仅对暂存的 .py 变更文件检查（路径相对于 git 根；在 backend 下执行，故仓库根目录下的 .py 需映射为 ../<path>）
  # 排除 tests 目录
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && FILES=(); for f in "$@"; do if [[ "$f" == backend/* ]]; then p="${f#backend/}"; else p="../$f"; fi; [[ "$p" == tests/* ]] && continue; [[ "$p" == skills/* ]] && continue; FILES+=("$p"); done; [[ ${#FILES[@]} -eq 0 ]] || uv run mypy "${FILES[@]}"' sh
        language: system
        types: [python]
        files: \.py$
        exclude: ^(webhooks/|backend/skills/)
        pass_filenames: true
