repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: \.py$
        exclude: ^(tests/|app/mcp/)

  # mypy 类型检查，使用本地 mypy.ini（与 make check 一致；tests/app.mcp 等由 mypy.ini 的 ignore_errors 统一控制）
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv
        language: system
        types: [python]
        files: \.py$
        args: [run, mypy]
