<!DOCTYPE html>
<html>
  <head>
    <title>IndexedDB 示例</title>
  </head>
  <body>
    <div>
      <h2>用户管理</h2>
      <form id="userForm">
        <input type="text" id="name" placeholder="姓名" required />
        <input type="email" id="email" placeholder="邮箱" required />
        <input type="number" id="age" placeholder="年龄" />
        <button type="submit">添加用户</button>
      </form>

      <div id="userList"></div>
      <button onclick="clearAll()">清空所有数据</button>
    </div>

    <script>
      let db;
      const dbName = "UserDB";
      const storeName = "users";
      const dbVersion = 1;

      // 初始化数据库
      function initDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(dbName, dbVersion);

          request.onerror = () => {
            console.error("数据库打开失败");
            reject(request.error);
          };

          request.onsuccess = () => {
            db = request.result;
            console.log("数据库打开成功");
            resolve(db);
          };

          request.onupgradeneeded = (event) => {
            const database = event.target.result;

            // 如果对象仓库不存在则创建
            if (!database.objectStoreNames.contains(storeName)) {
              const objectStore = database.createObjectStore(storeName, {
                keyPath: "id",
                autoIncrement: true,
              });

              // 创建索引
              objectStore.createIndex("name", "name", { unique: false });
              objectStore.createIndex("email", "email", { unique: true });
              objectStore.createIndex("age", "age", { unique: false });

              console.log("对象仓库创建成功");
            }
          };
        });
      }

      // 添加用户
      async function addUser(userData) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readwrite");
          const objectStore = transaction.objectStore(storeName);

          // 如果 userData 不含主键或主键无效，让 IndexedDB 自动生成 id
          // 如果包含有效的主键，则使用该主键
          const dataToAdd = { ...userData };
          // 只有当 id 不存在、为 undefined 或 null 时，才删除它让系统自动生成
          // 注意：如果 id 为 0，也会被保留使用
          if (dataToAdd.id === undefined || dataToAdd.id === null) {
            delete dataToAdd.id; // 删除 id 字段，让 autoIncrement 自动生成
          }
          // 如果 dataToAdd.id 存在且有值（包括 0），会使用该 id

          const request = objectStore.add(dataToAdd);

          request.onsuccess = () => {
            console.log("用户添加成功，生成的 ID:", request.result);
            resolve(request.result);
          };

          request.onerror = () => {
            console.error("添加用户失败", request.error);
            reject(request.error);
          };
        });
      }

      // 获取所有用户
      async function getAllUsers() {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readonly");
          const objectStore = transaction.objectStore(storeName);
          const request = objectStore.getAll();

          request.onsuccess = () => {
            resolve(request.result);
          };

          request.onerror = () => {
            reject(request.error);
          };
        });
      }

      // 根据ID获取用户
      async function getUserById(id) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readonly");
          const objectStore = transaction.objectStore(storeName);
          const request = objectStore.get(id);

          request.onsuccess = () => {
            resolve(request.result);
          };

          request.onerror = () => {
            reject(request.error);
          };
        });
      }

      // 更新用户
      async function updateUser(user) {
        console.info("updateUser", user);
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readwrite");
          const objectStore = transaction.objectStore(storeName);
          const request = objectStore.put(user);

          request.onsuccess = () => {
            console.log("用户更新成功");
            resolve(request.result);
          };

          request.onerror = () => {
            console.error("更新用户失败");
            reject(request.error);
          };
        });
      }

      // 删除用户
      async function deleteUser(id) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readwrite");
          const objectStore = transaction.objectStore(storeName);
          const request = objectStore.delete(id);

          request.onsuccess = () => {
            console.log("用户删除成功");
            resolve();
          };

          request.onerror = () => {
            console.error("删除用户失败");
            reject(request.error);
          };
        });
      }

      // 清空所有数据
      async function clearAll() {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([storeName], "readwrite");
          const objectStore = transaction.objectStore(storeName);
          const request = objectStore.clear();

          request.onsuccess = () => {
            console.log("所有数据已清空");
            displayUsers();
            resolve();
          };

          request.onerror = () => {
            console.error("清空数据失败");
            reject(request.error);
          };
        });
      }

      // 显示用户列表
      async function displayUsers() {
        const users = await getAllUsers();
        const userList = document.getElementById("userList");

        if (users.length === 0) {
          userList.innerHTML = "<p>暂无用户数据</p>";
          return;
        }

        userList.innerHTML =
          "<h3>用户列表:</h3>" +
          users
            .map(
              (user) => `
                    <div style="border:1px solid #ccc; margin:5px; padding:10px;">
                        <p>ID: ${user.id}</p>
                        <p>姓名: ${user.name}</p>
                        <p>邮箱: ${user.email}</p>
                        <p>年龄: ${user.age}</p>
                        <button onclick="editUser(${user.id})">编辑</button>
                        <button onclick="removeUser(${user.id})">删除</button>
                    </div>
                `
            )
            .join("");
      }

      // 编辑用户（示例）
      async function editUser(id) {
        const user = await getUserById(id);
        if (user) {
          const newName = prompt("请输入新的姓名:", user.name);
          if (newName) {
            user.name = newName;
            await updateUser(user);
            await displayUsers();
          }
        }
      }

      // 删除用户
      async function removeUser(id) {
        if (confirm("确定要删除这个用户吗？")) {
          await deleteUser(id);
          await displayUsers();
        }
      }

      // 表单提交处理
      document
        .getElementById("userForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const userData = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            age: parseInt(document.getElementById("age").value) || 0,
          };

          try {
            await addUser(userData);
            document.getElementById("userForm").reset();
            await displayUsers();
          } catch (error) {
            console.error("添加用户时出错:", error);
            if (error.name === "ConstraintError") {
              alert("邮箱已存在！");
            }
          }
        });

      // 初始化
      window.onload = async () => {
        try {
          await initDB();
          await displayUsers();
        } catch (error) {
          console.error("初始化失败:", error);
        }
      };
    </script>
  </body>
</html>
