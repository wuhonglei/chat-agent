version: '3.8'

services:
  promtail:
    image: grafana/promtail:latest
    container_name: ai-doc-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"  # Promtail管理端口
    volumes:
      # 挂载Promtail配置文件
      - ./config/promtail-config.yaml:/etc/promtail/config.yaml:ro
      # 挂载日志读取位置文件
      - ./positions:/positions
      # 挂载backend应用日志目录
      - /home/ubuntu/ai-doc/backend/logs:/var/log/app/backend:ro
      # 挂载Docker socket，用于发现容器
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 挂载Docker容器日志目录（备用方案）
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - promtail-network

networks:
  promtail-network:
    driver: bridge
