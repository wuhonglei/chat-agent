name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/src/**'
              - '.github/workflows/frontend-ci.yml'

  quality:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  pr-gate:
    needs: [changes, quality, build]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Frontend PR gate
        env:
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          Q: ${{ needs.quality.result }}
          B: ${{ needs.build.result }}
        run: |
          if [ "$FRONTEND" != "true" ]; then
            echo "No frontend paths in this PR; gate passes."
            exit 0
          fi
          if [ "$Q" != "success" ]; then
            echo "Frontend changed but quality did not succeed (result=$Q)."
            exit 1
          fi
          if [ "$B" != "success" ]; then
            echo "Frontend quality passed but build did not succeed (result=$B)."
            exit 1
          fi
          exit 0
