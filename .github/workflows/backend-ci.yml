name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Ruff check
        run: uv run ruff check app/

      - name: Mypy
        run: uv run mypy app/

      - name: Pytest
        run: |
          set +e
          uv run pytest --ignore=tests/mcp_demo
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "No tests collected (mcp_demo 已排除且当前无其它用例); 步骤通过。"
            exit 0
          fi
          exit "$code"
