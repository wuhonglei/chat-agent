name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/app/**'
              - '.github/workflows/backend-ci.yml'

  quality:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Ruff check
        run: uv run ruff check app/

      - name: Mypy
        run: uv run mypy app/

  # 始终在 PR 上执行并上报检查，避免「quality」被 paths 跳过时保护规则一直等不到状态，
  # 或与 Rulesets 中仅按 context 匹配的检查无法对齐。
  pr-gate:
    needs: [changes, quality]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Backend PR gate
        env:
          BACKEND: ${{ needs.changes.outputs.backend }}
          Q: ${{ needs.quality.result }}
        run: |
          if [ "$BACKEND" != "true" ]; then
            echo "No backend paths in this PR; gate passes."
            exit 0
          fi
          if [ "$Q" = "success" ]; then
            exit 0
          fi
          echo "Backend changed but quality did not succeed (result=$Q)."
          exit 1